version: '3.8'

services:
  web:
    image: ${APP_IMAGE}:${IMAGE_TAG}
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
