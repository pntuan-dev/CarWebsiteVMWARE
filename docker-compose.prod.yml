version: '3.8'

services:
  car-landing:
    image: ${APP_IMAGE}:${IMAGE_TAG}
    ports:
      - "3000:3000"
    environment:
      # URL nội bộ (server-side fetch trong container)
      - API_BASE_URL=http://car-admin:4000
      # URL public (client-side, browser)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
    networks:
      - vinfast_net

networks:
  vinfast_net:
    external: true
